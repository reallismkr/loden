<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOLOG · 채널 링크 허브</title>
  <meta property="og:title" content="TOLOG · 큐레이션 링크 허브" />
  <meta property="og:description" content="로덴하우스 · 로덴스튜디오 · 리얼리즘 추천템 바로가기" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 16px 60px;
      background: #f5f6fa; color: #191b22;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 26px; }
    .brand-pill {
      display: inline-block; padding: 5px 12px; border-radius: 999px;
      background: #111827; color: #fff; font-size: 11.5px; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px;
    }
    .brand h1 { margin: 0 0 6px; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
    .brand p { margin: 0; font-size: 13.5px; color: #6b7280; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .ch-card {
      display: flex; align-items: center; gap: 14px; padding: 18px 16px;
      background: #fff; border-radius: 20px; text-decoration: none; color: inherit;
      border: 1px solid #ebedf3; box-shadow: 0 4px 18px rgba(17,24,39,.05);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .ch-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(17,24,39,.09); }
    .ch-av {
      width: 54px; height: 54px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 23px; font-weight: 900; letter-spacing: -0.5px;
    }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name { font-size: 16.5px; font-weight: 900; color: #111827; }
    .ch-handle { font-size: 11.5px; font-weight: 700; color: #6b7280; margin-top: 2px; }
    .ch-bio { font-size: 12.8px; color: #4b5563; margin-top: 5px; line-height: 1.4; }
    .ch-arrow { font-size: 24px; color: #9ca3af; font-weight: 400; padding-left: 4px; }
    .foot { text-align: center; margin-top: 32px; font-size: 11px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-pill">TOLOG.KR</div>
      <h1>채널 바로가기</h1>
      <p>원하시는 채널을 선택해 주세요</p>
    </div>
    <div class="list">
      <a class="ch-card" href="./loden/">
              <div class="ch-av" style="background:linear-gradient(135deg, #10b981, #047857);">L</div>
              <div class="ch-info">
                <div class="ch-name">🏠 로덴하우스 · 스튜디오</div>
                <div class="ch-handle">@loden.haus · @loden.studios</div>
                <div class="ch-bio">영상 속 핵심재료 &amp; 살림·뷰티·신박템 모음 🤍</div>
              </div>
              <div class="ch-arrow">›</div>
            </a><a class="ch-card" href="./realism/">
              <div class="ch-av" style="background:linear-gradient(135deg, #1e293b, #0f172a);">R</div>
              <div class="ch-info">
                <div class="ch-name">⚡ 리얼리즘 큐레이션</div>
                <div class="ch-handle">REALLISM · 밀리터리 · 테크 · 추천템</div>
                <div class="ch-bio">영상·피드 속 화제의 아이템 바로가기 ⚡</div>
              </div>
              <div class="ch-arrow">›</div>
            </a>
    </div>
    <div class="foot">쿠팡 파트너스 활동의 일환으로 일정 수수료를 제공받습니다 · IOG</div>
  </div>
</body>
</html>
