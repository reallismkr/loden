<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로덴하우스 꿀템 · 레시피 모음</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 16px 56px;
      background: #f4f5f9; color: #1e2128;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .disc { text-align: center; font-size: 11px; color: #9ea4b0; margin-bottom: 16px; }
    .head { text-align: center; margin-bottom: 18px; }
    .head h1 { margin: 0 0 6px; font-size: 22px; font-weight: 900; letter-spacing: -0.4px; }
    .head p { margin: 0; font-size: 13.5px; color: #6e7482; }
    .store-btn {
      display: block; text-align: center; margin: 14px 0 14px; padding: 13px 16px;
      border-radius: 14px; background: #1a1b1f; color: #fff; font-weight: 800; font-size: 14.5px;
      text-decoration: none; box-shadow: 0 6px 18px rgba(20,24,38,.12);
    }
    .search {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid #e3e6ee;
      background: #fff; font-size: 14.5px; outline: none; margin-bottom: 14px;
    }
    .search:focus { border-color: #e08214; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: block; background: #fff; border-radius: 16px; padding: 14px 16px;
      text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(20,24,38,.04);
      border: 1px solid #eef0f5;
    }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .tag {
      font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      background: #fff3e0; color: #d97706;
    }
    .code { font-size: 11.5px; font-weight: 800; color: #6b7280; }
    .item-title { font-size: 15.5px; font-weight: 800; color: #1a1c20; }
    .item-sub { font-size: 12.8px; color: #7a808d; margin-top: 3px; }
    .empty { text-align: center; padding: 36px 16px; color: #8c92a0; font-size: 13.5px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="disc">쿠팡 파트너스 활동의 일환으로 일정 수수료를 제공받습니다</div>
    <div class="head">
      <h1>🏠 로덴하우스 꿀템 · 레시피 모음</h1>
      <p>영상 속 핵심재료 &amp; 리빙·뷰티 꿀템 🤍</p>
    </div>
    <a class="store-btn" href="https://influencers.coupang.com/s/Loden_studio" target="_blank" rel="noopener noreferrer">🛍️ 로덴하우스 쿠팡 전체 상품 보러가기 ›</a>
    <input class="search" id="q" type="search" placeholder="번호 또는 키워드로 검색 (예: 단호박, 비판텐, 로덴5)" oninput="filterList()" />
    <div class="list" id="list">
      <div class="empty">아직 등록된 레시피·꿀조합 카드가 없습니다.<br>곧 첫 번째 비밀 레시피가 올라옵니다 🤍</div>
    </div>
  </div>
  <script>
    function filterList() {
      const v = (document.getElementById('q').value || '').trim().toLowerCase();
      document.querySelectorAll('#list .item').forEach(el => {
        const hay = el.getAttribute('data-q') || '';
        el.style.display = (!v || hay.includes(v)) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
