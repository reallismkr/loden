<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리얼리즘 큐레이션 · TOLOG</title>
  <meta property="og:title" content="리얼리즘 큐레이션" />
  <meta property="og:description" content="영상·피드 속 화제의 아이템 바로가기 ⚡" />
  <style>
    :root {
      --accent: #f59e0b;
      --accent-soft: #fffbeb;
      --accent-dark: #92400e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px 14px 64px;
      background: #f5f6fa; color: #181a20;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .disc { text-align: center; font-size: 11px; color: #9ca3af; margin-bottom: 16px; }
    .prof { text-align: center; margin-bottom: 16px; }
    .av {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 10px;
      background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; font-size: 30px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(17,24,39,.14);
    }
    .prof h1 { margin: 0 0 4px; font-size: 20px; font-weight: 900; letter-spacing: -0.4px; }
    .prof .hdl { font-size: 12px; color: #6b7280; font-weight: 700; margin-bottom: 6px; }
    .prof .bio { margin: 0; font-size: 13.2px; color: #4b5563; }

    .store-btn {
      display: block; text-align: center; margin: 14px 0 12px; padding: 14px 16px;
      border-radius: 15px; background: #14161a; color: #fff; font-weight: 800; font-size: 14.5px;
      text-decoration: none; box-shadow: 0 6px 18px rgba(17,24,39,.14);
    }
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search {
      width: 100%; padding: 13px 16px 13px 40px; border-radius: 14px; border: 1.5px solid #e5e7eb;
      background: #fff; font-size: 14.5px; outline: none; color: #111827;
      box-shadow: 0 2px 8px rgba(17,24,39,.03);
    }
    .search:focus { border-color: var(--accent); }
    .search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .55; }

    .tabs { display: flex; gap: 7px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 9px 10px; border-radius: 11px; border: 1px solid #e5e7eb;
      background: #fff; color: #6b7280; font-size: 12.8px; font-weight: 800; cursor: pointer;
    }
    .tab.active { background: #14161a; color: #fff; border-color: #14161a; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .pcard {
      display: flex; flex-direction: column; background: #fff; border-radius: 16px; overflow: hidden;
      text-decoration: none; color: inherit; border: 1px solid #eceef4;
      box-shadow: 0 3px 12px rgba(17,24,39,.04); transition: transform .13s ease;
    }
    .pcard:active { transform: scale(0.98); }
    .pthumb { position: relative; aspect-ratio: 1 / 1; background: #f3f4f6; overflow: hidden; }
    .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; padding: 12px; text-align: center;
    }
    .ph-ico { font-size: 30px; }
    .ph-code { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }
    .pcode {
      position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(17,24,39,.82); color: #fff; font-size: 11px; font-weight: 800;
      backdrop-filter: blur(4px);
    }
    .pkind {
      position: absolute; bottom: 8px; right: 8px; padding: 2px 7px; border-radius: 7px;
      background: rgba(255,255,255,.92); color: #111827; font-size: 10.5px; font-weight: 800;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .pkind.is-recipe { background: #fff3e0; color: #c2410c; }
    .pbody { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; justify-content: space-between; }
    .ptitle {
      font-size: 13.8px; font-weight: 800; color: #111827; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .psub {
      font-size: 11.5px; color: #6b7280; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pcta { font-size: 11.5px; font-weight: 800; color: var(--accent-dark); margin-top: 4px; }
    .empty {
      text-align: center; padding: 42px 16px; color: #8c92a0; font-size: 13.5px; line-height: 1.65;
      background: #fff; border-radius: 16px; border: 1px dashed #e5e7eb;
    }
    .no-res { display: none; text-align: center; padding: 28px 16px; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="disc">쿠팡 파트너스 활동의 일환으로 일정 수수료를 제공받습니다</div>
    <div class="prof">
      <div class="av">R</div>
      <h1>리얼리즘 큐레이션</h1>
      <div class="hdl">REALLISM · 밀리터리 · 테크 · 추천템</div>
      <p class="bio">영상·피드 속 화제의 아이템 바로가기 ⚡</p>
    </div>
    
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input class="search" id="q" type="search" placeholder="번호 또는 키워드 검색 (예: 5, 97, 단호박)" oninput="applyFilter()" />
    </div>
    
    <div class="empty">아직 등록된 상품이 없습니다.<br/>곧 엄선된 추천템이 업데이트됩니다 🤍</div>
    <div class="grid" id="grid">
      
    </div>
    <div class="no-res" id="noRes">검색 결과가 없습니다. 다른 번호나 키워드로 찾아보세요!</div>
  </div>
  <script>
    let curKind = 'all';
    function setKind(k, btn) {
      curKind = k;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFilter();
    }
    function applyFilter() {
      const v = (document.getElementById('q').value || '').trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('#grid .pcard').forEach(el => {
        const hay = el.getAttribute('data-q') || '';
        const k = el.getAttribute('data-kind') || 'short';
        const ok = (!v || hay.includes(v)) && (curKind === 'all' || k === curKind);
        el.style.display = ok ? 'flex' : 'none';
        if (ok) shown++;
      });
      const nr = document.getElementById('noRes');
      if (nr) nr.style.display = (shown === 0 && document.querySelectorAll('#grid .pcard').length > 0) ? 'block' : 'none';
    }
  </script>
</body>
</html>
